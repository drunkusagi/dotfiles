monitor = ,preferred,auto,1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = wl-paste -t text --watch clipman store --no-persist
exec-once = hyprpm reload -n

input {
  kb_layout = us
  follow_mouse = 1
  mouse_refocus = false
  force_no_accel = 0
  touchpad {
      natural_scroll = true
  }
}

device {
  name = syna3602:00-093a:0255-touchpad
  sensitivity = 0.5
}

misc {
  vfr = true
  disable_hyprland_logo = true
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
}

general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    # #555496 #d9dceb #bf6c68 #dcd9e4 #6162a2
    col.active_border = rgb(555496) rgb(d9dceb) rgb(bf6c68) rgb(dcd9e4) 5deg
    col.inactive_border = 0xff45475a
}

decoration {
    rounding = 3
    blur {
      enabled = true
      size = 6
      passes = 2
      popups_ignorealpha = 1.0
      ignore_opacity = true
      new_optimizations = true
      xray = false
    }
}

animations {
  enabled = 1
  bezier = overshot,0.13,0.99,0.29,1.1
  animation = windows,1,4,overshot,slide
  animation = border,1,10,default
  animation = fade,1,10,default
  animation = workspaces,1,6,overshot,slidevert
}

dwindle {
    pseudotile = true
    force_split = 0
}

master {

}

gestures {
    workspace_swipe_min_speed_to_force = 20
    workspace_swipe_forever = true
}

xwayland {
  force_zero_scaling = true
}

cursor {
  enable_hyprcursor = true
}

debug {
  overlay = false
}

source = ./key-bindings.conf
source = ./window-rules.conf
source = ./workspace-rules.conf
source = ./plugins-config.conf

